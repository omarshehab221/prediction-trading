# Render Blueprint for the BTC 5m prediction-market bot.
#
# THREE THINGS THAT WILL BREAK THIS IF IGNORED
# --------------------------------------------
# 1. REGION MUST NOT BE IN THE UNITED STATES.
#    Binance returns HTTP 451 to restricted locations, which include the US.
#    Render's oregon / ohio / virginia regions are all US and every API call
#    fails there, including the public price feed. Use frankfurt or singapore.
#
# 2. THE DISK HOLDS BOTH THE CONFIG AND THE JOURNAL.
#    Render's filesystem is ephemeral. Without a disk the journal is wiped on
#    every deploy -- and the journal is the calibration record, the only thing
#    that can tell you whether the strategy has an edge. The config lives
#    there too, so the edits you make are not lost on the next restart.
#
# 3. BACKGROUND WORKER, NOT WEB SERVICE.
#    A long-running loop with no HTTP port. Free web services also spin down
#    when idle, which would stop the loop mid-round. Workers are paid only.
#
# The config file is written ONCE, on first boot, by entrypoint.sh. Later
# starts keep whatever is on the disk, so hot reload and your edits survive
# every deploy. To reset it, delete the file from the Render shell.

services:
  - type: worker
    name: btc-5m-predictor
    runtime: python
    region: frankfurt          # NEVER a US region -- see note 1
    plan: starter
    # Verification runs twice on purpose. Here it fails the BUILD, so broken
    # code never reaches a deploy at all. entrypoint.sh runs it again at boot,
    # because the runtime environment is not the build environment.
    buildCommand: >
      pip install -r requirements.txt &&
      chmod +x entrypoint.sh verify.sh &&
      BINANCE_API_KEY=build BINANCE_API_SECRET=build ./verify.sh
    startCommand: ./entrypoint.sh
    autoDeploy: false          # a redeploy mid-round interrupts a position
    disk:
      name: data
      mountPath: /var/data     # must match CONFIG_PATH and DB_PATH below
      sizeGB: 1
    envVars:
      - key: BINANCE_API_KEY
        sync: false            # set in the dashboard, never in git
      - key: BINANCE_API_SECRET
        sync: false
      - key: CONFIG_PATH
        value: /var/data/config.json
      - key: DB_PATH
        value: /var/data/btc5m_journal.db
      - key: PROFILE
        value: straddle          # only when the config is first created;
                               # must match DEFAULT_PROFILE in the module
      # paper | live. Pins the mode, overriding the config file's `live`.
      # Leave it unset to let config.json govern, which makes the mode
      # hot-reloadable: edit the file and the bot switches once it is flat.
      - key: TRADING_MODE
        # value: paper
        value: live
      # Comma-separated markets to RESTRICT trading to, e.g. BTCUSDT,ETHUSDT.
      # Pins `symbols`, overriding the config file, the same way TRADING_MODE
      # pins `live`. Leave empty (the default) to discover and trade every
      # 5-minute up/down market the venue lists.
      - key: SYMBOLS
        value: ""
      - key: PYTHONUNBUFFERED
        value: "1"             # stream logs live instead of in bursts
      # Set to "1" only to start a bot whose checks are failing, while you
      # investigate. It means the code has NOT been verified.
      - key: SKIP_VERIFY
        value: "0"
      # Preflight probes the live API at boot. "0" downgrades a failure to a
      # warning; "1" (default) refuses to start on one.
      - key: PREFLIGHT_REQUIRED
        value: "1"
      # Seconds preflight waits for a signed request to be ACCEPTED before
      # giving up. This exists because a starter worker has no dedicated IP:
      # the outbound address is not knowable until the process is running and
      # can change on any restart, so it cannot be added to Binance's
      # allowlist in advance. Preflight prints the address and then keeps
      # knocking, which turns a one-second race into a window long enough to
      # paste it into the key's allowlist.
      #
      # Bounded, not infinite: a worker waiting forever on a key that is
      # simply wrong costs money and reports nothing. Render restarts a
      # failed worker, so a genuinely transient problem resolves on the next
      # attempt. Set to "0" to fail on the first refusal.
      - key: AUTH_WAIT_S
        value: "600"
